<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    
    <radialGradient id="cyanAmbient" cx="40%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Icon Gradients -->
    <linearGradient id="planeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="40%" stop-color="#0070ba"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="planeGrad2" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0070ba"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0070ba" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for glow effects -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#bgGlow)"/>
  <rect width="1200" height="800" fill="url(#cyanAmbient)"/>

  <!-- Decorative Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
  </g>

  <!-- Ambient Light Streak Behind Logo -->
  <ellipse cx="600" cy="300" rx="260" ry="80" fill="#0070ba" opacity="0.25" filter="url(#neonGlow)"/>

  <!-- ==================== CENTRAL ICON ==================== -->
  <g transform="translate(600, 260)" filter="url(#dropShadow)">
    
    <!-- Outer Shield / Document Silhouette -->
    <path d="M-90,-120 L50,-120 C70,-120 90,-100 90,-80 L90,60 C90,120 0,160 0,160 C0,160 -90,120 -90,60 Z" 
          fill="#1e293b" 
          stroke="url(#planeGrad1)" 
          stroke-width="3" 
          opacity="0.7"/>

    <!-- Document Lines (Abstract Financial Lines) -->
    <rect x="-60" y="-70" width="60" height="8" rx="4" fill="#64748b" opacity="0.5"/>
    <rect x="-60" y="-45" width="80" height="8" rx="4" fill="#64748b" opacity="0.5"/>
    <rect x="-60" y="-20" width="50" height="8" rx="4" fill="#64748b" opacity="0.5"/>

    <!-- Glowing Paper Airplane (The "Pilot" Metaphor) -->
    <!-- Left Wing -->
    <polygon points="-80,-60 110,-10 -10,20 -30,80" fill="url(#planeGrad1)"/>
    <!-- Center Crease / Fold -->
    <polygon points="-80,-60 110,-10 -10,20" fill="url(#planeGrad2)"/>
    <!-- Top Wing Highlights -->
    <polygon points="-80,-60 110,-10 -30,0" fill="#38bdf8" opacity="0.9"/>
    
    <!-- Neon Flight Trail / Jetstream -->
    <path d="M-80,-60 Q-150,-100 -210,-40" 
          stroke="#00d2ff" 
          stroke-width="4" 
          stroke-linecap="round" 
          fill="none" 
          filter="url(#neonGlow)"/>
    <path d="M-70,-45 Q-140,-75 -190,-20" 
          stroke="#6366f1" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.8"/>

    <!-- Verified Checkmark Shield (Human Governance Emblem) -->
    <g transform="translate(45, 65)">
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#10b981" stroke-width="3" filter="url(#dropShadow)"/>
      <path d="M-10,-1 L-3,6 L12,-9" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <!-- "InvoicePilot" -->
  <text x="600" y="520" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
    <tspan fill="#ffffff">Invoice</tspan>
    <tspan fill="url(#textGrad)">Pilot</tspan>
  </text>

  <!-- Accent Divider -->
  <line x1="380" y1="560" x2="820" y2="560" stroke="url(#accentLine)" stroke-width="2"/>

  <!-- Subtitle / Tagline -->
  <text x="600" y="605" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#94a3b8" letter-spacing="4">
    AI INVOICE AGENT &bull; PAYPAL INVOICING API V2
  </text>

  <!-- Feature Pills Footer -->
  <g transform="translate(600, 680)">
    <!-- Pill 1: Human-in-the-Loop -->
    <g transform="translate(-180, 0)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="-115" cy="0" r="5" fill="#10b981"/>
      <text x="-98" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
        Human-in-the-Loop Gate
      </text>
    </g>

    <!-- Pill 2: PayPal Sandbox Live -->
    <g transform="translate(180, 0)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="-115" cy="0" r="5" fill="#0070ba"/>
      <text x="-98" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
        PayPal Sandbox Verified
      </text>
    </g>
  </g>
</svg>
